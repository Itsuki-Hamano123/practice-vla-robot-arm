# Phase B：fine-tune 済みモデル用（policy_base_gpu.yaml との差：model_path・norm_stats・control_hz・max_step）
model_path: outputs/train/so101_smolvla/checkpoints/004000/pretrained_model   # 評価で最良だった 4000 ステップ（docs/実験結果.md）
device: cuda
num_threads: null        # torch のスレッド数（null なら torch の既定）
sync_mode: false         # GPU環境ではモデル推論が約 0.3 秒なので、現実世界での実行を考慮して、推論中であっても sim 内の時間を止めたりしない（推論したアクションチャンクは全部実行してから、次のアクションチャンクの推論を開始する。実装のシンプルさのため、同期的な推論で実装した。）
control_hz: 10          # データセットの fps と同じ（sim 時間）
n_action_steps: 50       # チャンク（50）のうち実行する数
max_chunks: 6          # 通し確認は 2。評価では 6
stop_on_done: true       # success / wrong になったら終える
reset: true              # 始める前に /scene/reset する
instruction: "pick up the red box"
# トピック → モデルの入力キー。smolvla_base は camera1〜3（256×256 の記載だが、モデル内で 512×512 にパディング付きで縮小される）。
# camera3 は渡さなくても推論できる。生画像は rclpy のデシリアライズが遅いので /compressed（JPEG）を使う
camera_map:
  /cam_front/image_raw/compressed: observation.images.camera1
  /cam_wrist/image_raw/compressed: observation.images.camera2
image_size: null         # [幅, 高さ] に縮小してから渡す。null ならそのまま（640×480）
state_unit: degree       # 学習データ（SO-100 系）の関節の単位。行動も同じ単位
# 正規化の統計。smolvla_base には 'so100' / 'so100-red' / 'so100-blue' の action の統計しかない（PolicyRunner 参照）
norm_stats: null        # fine-tune 済みモデルは自前の統計を持つので、当て直さない
max_step: 0.15          # 1ステップ（1/10 秒）あたりの関節の最大変化 [rad]。30Hz の 0.05 の 3 倍
rerun:
  save_dir: outputs/rrd
  live: false
  urdf: outputs/so101.urdf
