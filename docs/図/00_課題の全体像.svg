<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1362px" height="742px" viewBox="0 0 1362 742"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="0" y="0" width="1000" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(0, 0, 0);"><text x="2" y="22">課題の全体像：言語指示で動作を切り替える VLA を、自分で集めたデモデータセットでファインチューニングする</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><path d="M 0 68 L 0 40 L 1360 40 L 1360 68" fill="#d5e8d4" stroke="#82b366" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/><path d="M 0 68 L 0 300 L 1360 300 L 1360 68" fill="#ffffff" stroke="#82b366" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(130, 179, 102);"/><path d="M 0 68 L 1360 68" fill="none" stroke="#82b366" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(130, 179, 102);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(0, 0, 0);"><text x="680" y="59.5">① ゴール：VLAを使うと、言語指示だけで挙動（掴む箱）を切り替えられるのが特徴的なので、それを確かめてみる</text></g></g><g data-cell-id="sc"><g transform="translate(0.5,0.5)"><rect x="30" y="90" width="260" height="140" rx="21" ry="21" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="160" y="151">Gazebo 上の SO-101 アーム</text><text x="160" y="165">机の上に赤箱・青箱</text><text x="160" y="179">（左右の配置はランダムに入替）</text></g></g></g><g data-cell-id="p1"><g transform="translate(0.5,0.5)"><rect x="360" y="85" width="250" height="60" rx="9" ry="9" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: rgb(248, 206, 204); stroke: rgb(184, 84, 80);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="485" y="113">指示（英語）</text><text x="485" y="127">"pick up the red box"</text></g></g></g><g data-cell-id="p2"><g transform="translate(0.5,0.5)"><rect x="360" y="175" width="250" height="60" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="485" y="203">指示（英語）</text><text x="485" y="217">"pick up the blue box"</text></g></g></g><g data-cell-id="md"><g transform="translate(0.5,0.5)"><rect x="690" y="110" width="250" height="100" rx="15" ry="15" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(215, 155, 0);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="815" y="158">SmolVLA（VLA）</text><text x="815" y="172">画像＋関節角＋指示文 → 行動</text></g></g></g><g data-cell-id="q1"><g transform="translate(0.5,0.5)"><rect x="1020" y="85" width="300" height="60" rx="9" ry="9" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: rgb(248, 206, 204); stroke: rgb(184, 84, 80);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="1170" y="120">赤箱を持ち上げる</text></g></g></g><g data-cell-id="q2"><g transform="translate(0.5,0.5)"><rect x="1020" y="175" width="300" height="60" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="1170" y="210">青箱を持ち上げる</text></g></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><path d="M 160 230 L 160 255 Q 160 265 170 265 L 805 265 Q 815 265 815 255 L 815 216.37" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 815 211.12 L 818.5 218.12 L 815 216.37 L 811.5 218.12 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(0, 0, 0);"><rect fill="#ffffff" stroke="none" x="417" y="259" width="162" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="498" y="269.5">観測（カメラ画像2枚・関節角）</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><path d="M 610 115 L 640 115 Q 650 115 650 125 L 650 132.5 Q 650 140 660 140 L 683.63 140" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 688.88 140 L 681.88 143.5 L 683.63 140 L 681.88 136.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><path d="M 610 205 L 640 205 Q 650 205 650 195 L 650 187.5 Q 650 180 660 180 L 683.63 180" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 688.88 180 L 681.88 183.5 L 683.63 180 L 681.88 176.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><path d="M 940 140 L 970 140 Q 980 140 980 130 L 980 122.5 Q 980 115 990 115 L 1013.63 115" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 1018.88 115 L 1011.88 118.5 L 1013.63 115 L 1011.88 111.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><path d="M 940 180 L 970 180 Q 980 180 980 190 L 980 197.5 Q 980 205 990 205 L 1013.63 205" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 1018.88 205 L 1011.88 208.5 L 1013.63 205 L 1011.88 201.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><path d="M 0 358 L 0 330 L 1360 330 L 1360 358" fill="#fff2cc" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/><path d="M 0 358 L 0 560 L 1360 560 L 1360 358" fill="#ffffff" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 182, 86);"/><path d="M 0 358 L 1360 358" fill="none" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(214, 182, 86);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(0, 0, 0);"><text x="680" y="349.5">② 進め方：デモ収集 → ファインチューニング → 評価</text></g></g><g data-cell-id="a"><g transform="translate(0.5,0.5)"><rect x="30" y="390" width="230" height="90" rx="13.5" ry="13.5" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="145" y="419">Phase A（Zero-Shot）</text><text x="145" y="433">smolvla_base をそのまま推論</text><text x="145" y="447">（VLAであっても基本は下流タスクでの</text><text x="145" y="461">学習が必要であることを体験）</text></g></g></g><g data-cell-id="b"><g transform="translate(0.5,0.5)"><rect x="310" y="390" width="230" height="90" rx="13.5" ry="13.5" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="425" y="426">ファインチューニング用のデモ収集</text><text x="425" y="440">IK で軌道を自動生成</text><text x="425" y="454">成功 100 エピソード（赤50・青50）</text></g></g></g><g data-cell-id="c"><g transform="translate(0.5,0.5)"><rect x="590" y="390" width="230" height="90" rx="13.5" ry="13.5" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(215, 155, 0);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="705" y="426">ファインチューニング（GPU）</text><text x="705" y="440">収集したデモデータセットで smolvla_base を</text><text x="705" y="454">追加学習（lerobot-train）</text></g></g></g><g data-cell-id="dd"><g transform="translate(0.5,0.5)"><rect x="870" y="390" width="230" height="90" rx="13.5" ry="13.5" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="985" y="426">Phase B 推論</text><text x="985" y="440">ファインチューニング済みモデルで</text><text x="985" y="454">同じパイプラインで実行</text></g></g></g><g data-cell-id="ev"><g transform="translate(0.5,0.5)"><rect x="1140" y="390" width="200" height="90" rx="13.5" ry="13.5" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: rgb(225, 213, 231); stroke: rgb(150, 115, 166);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="1240" y="426">評価・比較</text><text x="1240" y="440">赤青×左右入替×10回＝40試行</text><text x="1240" y="454">Phase A と Phase B を比べる</text></g></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><path d="M 260 435 L 303.63 435" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 308.88 435 L 301.88 438.5 L 303.63 435 L 301.88 431.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><path d="M 540 435 L 583.63 435" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 588.88 435 L 581.88 438.5 L 583.63 435 L 581.88 431.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><path d="M 820 435 L 863.63 435" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 868.88 435 L 861.88 438.5 L 863.63 435 L 861.88 431.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c13"><g transform="translate(0.5,0.5)"><path d="M 1100 435 L 1133.63 435" fill="none" stroke="#333333" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 1138.88 435 L 1131.88 438.5 L 1133.63 435 L 1131.88 431.5 Z" fill="#333333" stroke="#333333" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><path d="M 0 618 L 0 590 L 1360 590 L 1360 618" fill="#f5f5f5" stroke="#666666" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/><path d="M 0 618 L 0 740 L 1360 740 L 1360 618" fill="#ffffff" stroke=